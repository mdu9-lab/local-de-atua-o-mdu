<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local de Atuação MDU — Dasa</title><style>
:root{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#263347;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}button,select,textarea,input{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e7ebf0;padding:22px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.5px}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 5px}p{margin:0;color:#778394;font-size:14px}.identity{display:flex;align-items:center;gap:14px;font-size:13px}.link{border:0;background:none;color:#536a8e;padding:6px}main{max-width:1248px;margin:30px auto;padding:0 24px}.tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}.tab{background:transparent;border:0;padding:11px 15px;color:#647185;border-radius:9px;font-weight:600}.tab.active{background:#e9eef7;color:#273d63}.section{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}.nav{display:flex;gap:9px;align-items:center}.nav button,.secondary{border:1px solid #dfe5ed;background:#fff;border-radius:9px;padding:9px 13px;color:#42516a}.nav span{font-size:13px;font-weight:650;min-width:155px;text-align:center}.panel{background:white;border:1px solid #e8edf3;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #243d5c08}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:850px}th,td{border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}thead th{background:#f8fafd;padding:16px 14px;font-size:13px;color:#42516a}thead th small{display:block;font-weight:400;color:#8c97a6;margin-top:5px}tbody th{padding:17px 14px;font-size:13px;width:170px;white-space:nowrap;background:white}tbody td{padding:7px;min-height:90px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}td textarea{border:1px solid transparent;border-radius:7px;resize:vertical;min-height:83px;width:100%;padding:9px 8px;color:#28374b;background:#f5f8fd;outline:none;font-size:13px;line-height:1.5}td textarea:focus{border-color:#96acd1;background:#fff}td.readonly{padding:16px 12px;color:#435168}td .empty{color:#bdc6d1}tr.me th{color:#254e8b}tr:last-child th,tr:last-child td{border-bottom:0}tr th:last-child,tr td:last-child{border-right:0}.hint{font-size:12px;color:#8793a3;margin-top:13px}.loginwrap{min-height:75vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:#fff;border:1px solid #e9edf4;border-radius:18px;padding:36px;box-shadow:0 12px 40px #2c42600a}.login h2{margin-bottom:12px}.login p{margin-bottom:26px}.login label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}.login select{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:9px;background:white;margin-bottom:20px}.primary{background:#2e4368;color:white;border:0;border-radius:9px;padding:13px 20px;font-weight:650}.full{width:100%}.cards{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:13px}.daycard{border:1px solid #e8edf3;background:#fff;border-radius:13px;padding:19px;min-height:175px}.daycard h3{font-size:15px;margin:0}.date{font-size:12px;color:#8995a5;margin:4px 0 17px}.daycard ul{padding:0;margin:0;list-style:none}.daycard li{font-size:13px;margin:0 0 11px;padding-left:12px;border-left:2px solid #7f9ac1}.none{font-size:13px;color:#a3adbb}.daily{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.person{padding:18px 22px;border-bottom:1px solid #edf0f5}.person:nth-child(odd){border-right:1px solid #edf0f5}.person strong{display:block;font-size:14px;margin-bottom:8px}.person div{white-space:pre-wrap;font-size:13px;color:#55647a;line-height:1.6}.dateinput{padding:8px;border:1px solid #dfe5ed;border-radius:8px;color:#42516a}.hidden{display:none!important}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:20px 24px}.daily{grid-template-columns:1fr}.person:nth-child(odd){border-right:0}}@media(max-width:520px){.cards{grid-template-columns:1fr}.identity{gap:4px}header h1{font-size:16px}.login{padding:25px}.nav{flex-wrap:wrap}}

/* Visões diárias otimizadas para telas pequenas */

 header{padding:15px 16px;align-items:flex-start}header h1{font-size:17px}header p{font-size:12px}
 .identity{flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;white-space:nowrap}
 main{margin:18px auto;padding:0 12px}.tabs{gap:4px;margin-bottom:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
 .tab{padding:11px 4px;font-size:12px;line-height:1.3;text-align:center}

 .person strong{font-size:14px;margin-bottom:5px}.person div{font-size:14px;line-height:1.55}
 .cards{display:flex;flex-direction:column;gap:9px}.daycard{min-height:0;padding:15px 16px;border-radius:11px}
 .daycard h3{font-size:15px}.daycard .date{margin:3px 0 10px}.daycard ul{display:flex;flex-wrap:wrap;gap:8px 16px}

}
@media(min-width:651px) and (max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Identidade visual Dasa — aplicação discreta na interface */
:root{color:#24263e;background:#f5f8fb}
header{background:#24263e;border-bottom:3px solid #2355d9;color:#fff}
header h1{color:#fff}header p{color:#c4e5ee}.identity{color:#fff}.link{color:#b8e4ee}.link:hover{color:#fff}
.tab{color:#525c75}.tab:hover{background:#e6f2f7;color:#24263e}.tab.active{background:#2355d9;color:#fff}
h2{color:#24263e}.section p{color:#67758b}
.nav button,.secondary{border-color:#d5e1eb;color:#24263e}.nav button:hover{background:#e9f5f9}
.panel{border-color:#dbe6ee;box-shadow:0 4px 16px #24263e0a}
thead th{background:#24263e;color:#fff;border-color:#3c4363}thead th small{color:#b4e0eb}
tbody th{background:#f1f7fb;color:#24263e}tbody tr:nth-child(even) th{background:#e9f2f8}
th,td{border-color:#e0e9f0}tr.me th{color:#2355d9;border-left:3px solid #f05a45}

@media(max-width:650px){.person:nth-child(4n+1),.person:nth-child(4n+2){border-left:0}.person{border-bottom:1px solid #e4edf3}.person strong{border-left:3px solid #2355d9;padding-left:9px}}
</style></head><body><div id="loginScreen" class="loginwrap hidden"><div class="login"><h2>Bem-vindo(a)</h2><p>Escolha seu nome para acessar a programação.</p><label for="who">Seu nome</label><select id="who"></select><button class="primary full" onclick="enter()">Entrar</button></div></div><div id="app" class="hidden"><header><div><h1>Local de Atuação MDU</h1><p>Programação da equipe</p></div><div class="identity"><span id="identity"></span><button class="link" onclick="switchUser()">Trocar usuário</button></div></header><main><nav id="tabs" class="tabs"></nav><div id="content"></div></main></div><script>
// Edite esta lista para adicionar os nomes reais. O perfil é determinado automaticamente.
const USERS=['Adriana','Bianca','Camila','Carlos','Frederico','Jacqueline','Lindemberg','Maryanna','Renan','Suellen','Tatiana','Jéssica'].map(name=>({name,role:'consultor'})).concat([{name:'Fabiana',role:'coordenadora'}]);
const SUPABASE_URL='https://gzovfuuwnyzjukdheecv.supabase.co';
const SUPABASE_KEY='sb_publishable_sXFssIUWF2ksrdtEOEc-cA_R5BZkt4M';
let remoteRecords={},dbUsers=[],connectionStatus='Carregando dados compartilhados…';
async function fetchShared(){try{const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};const [u,p]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/consultores?select=id,nome,perfil&ativo=eq.true',{headers}),fetch(SUPABASE_URL+'/rest/v1/programacoes?select=consultor_id,data,atividade',{headers})]);if(!u.ok||!p.ok)throw Error('Leitura bloqueada pelo RLS ou indisponível');dbUsers=await u.json();const rows=await p.json();remoteRecords={};const names=Object.fromEntries(dbUsers.map(x=>[x.id,x.nome]));rows.forEach(x=>{const n=names[x.consultor_id];if(n){remoteRecords[n]??={};remoteRecords[n][x.data]=x.atividade}});connectionStatus='Conectado ao Supabase';}catch(e){connectionStatus='Sem leitura compartilhada: configure a política SELECT no Supabase';}render()}
const USER_KEY='mdu-identity-v3',DATA_KEY='mdu-schedule-v2';const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta'];let current=USERS.find(u=>u.name===localStorage.getItem(USER_KEY))||null;let records=load();let weekOffset=0;let selectedDate=new Date();selectedDate.setHours(12,0,0,0);let active='schedule';function load(){try{return JSON.parse(localStorage.getItem(DATA_KEY))||{}}catch{return {}}}function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function monday(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+7*weekOffset);return d}function days(){let m=monday();return DAYS.map((_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}function fmt(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function holiday(d){const md=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return ({'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência do Brasil','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Dia Nacional de Zumbi e da Consciência Negra','12-25':'Natal'})[md]||null}
function get(name,d){const stored=remoteRecords[name]?.[key(d)] ?? records[name]?.[key(d)];return stored!==undefined && stored!==''?stored:(holiday(d)?'🇧🇷 Feriado Nacional — '+holiday(d):'')}function save(name,d,value){records[name]??={};records[name][key(d)]=value;localStorage.setItem(DATA_KEY,JSON.stringify(records))}function people(){return USERS.filter(u=>u.role==='consultor')}function enter(){current=USERS.find(u=>u.name===document.getElementById('who').value);if(!current)return;localStorage.setItem(USER_KEY,current.name);active=current.role==='consultor'?'schedule':'today';render();fetchShared()}function switchUser(){localStorage.removeItem(USER_KEY);current=null;render()}function changeTab(t){active=t;render();fetchShared()}function moveWeek(n){weekOffset+=n;render();fetchShared()}function moveDay(n){selectedDate.setDate(selectedDate.getDate()+n);render();fetchShared()}function setDate(v){if(!v)return;let [y,m,d]=v.split('-').map(Number);selectedDate=new Date(y,m-1,d,12);render();fetchShared()}function heading(title,sub,actions=''){return `<div class="section"><div><h2>${title}</h2><p>${sub}</p></div>${actions}</div>`}function weekNav(){let ds=days();return `<div class="nav"><button onclick="moveWeek(-1)" aria-label="Semana anterior">‹</button><span>${fmt(ds[0])} a ${fmt(ds[4])}/${ds[4].getFullYear()}</span><button onclick="moveWeek(1)" aria-label="Próxima semana">›</button></div>`}function schedule(){let ds=days();return heading('Programação semanal','Consulte e atualize a programação da equipe.',weekNav())+`<div class="panel tablewrap"><table><colgroup><col style="width:160px">${ds.map(()=>'<col>').join('')}</colgroup><thead><tr><th>Consultor</th>${ds.map((d,i)=>`<th>${DAYS[i]}<small>${fmt(d)}</small></th>`).join('')}</tr></thead><tbody>${people().map(u=>`<tr class="${u.name===current.name?'me':''}"><th>${safe(u.name)}${u.name===current.name?' · você':''}</th>${ds.map((d,i)=>(u.name===current.name||current.name==='Lindemberg')?`<td><textarea data-name="${safe(u.name)}" data-day="${i}" placeholder="Digite aqui..." oninput="saveMine(this)">${safe(get(u.name,d))}</textarea></td>`:`<td class="readonly">${safe(get(u.name,d))||'<span class="empty">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}let pendingSaves={};function saveMine(el){const name=el.dataset.name||current.name,date=key(days()[Number(el.dataset.day)]),value=el.value;save(name,days()[Number(el.dataset.day)],value);const pendingKey=name+'|'+date;clearTimeout(pendingSaves[pendingKey]);pendingSaves[pendingKey]=setTimeout(()=>pushSave(name,date,value),650)}
async function pushSave(name,date,value){const user=dbUsers.find(u=>u.nome===name);if(!user){connectionStatus='Sem conexão: alteração salva apenas neste navegador';renderStatus();return}try{const r=await fetch(SUPABASE_URL+'/rest/v1/programacoes?on_conflict=consultor_id,data',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({consultor_id:user.id,data:date,atividade:value,atualizado_em:new Date().toISOString()})});if(!r.ok)throw Error(await r.text());remoteRecords[name]??={};remoteRecords[name][date]=value;connectionStatus='Salvo no Supabase';}catch(e){connectionStatus='Falha ao sincronizar · alteração salva apenas neste navegador';console.error(e)}renderStatus()}
function renderStatus(){const el=document.getElementById('syncStatus');if(el)el.textContent=connectionStatus}function isHO(s){return /(^|[^a-záàâãéêíóôõúç])ho([^a-záàâãéêíóôõúç]|$)/i.test(s)}function ho(){return heading('HO da semana','Consultores em home office por dia.',weekNav())+`<div class="cards">${days().map((d,i)=>{let names=people().filter(u=>isHO(get(u.name,d))).map(u=>u.name);return `<section class="daycard"><h3>${DAYS[i]}</h3><div class="date">${fmt(d)}</div>${names.length?`<ul>${names.map(n=>`<li>${safe(n)}</li>`).join('')}</ul>`:'<span class="none">Nenhum HO informado</span>'}</section>`}).join('')}</div>`}function today(){let date=selectedDate;let title=date.toLocaleDateString('pt-BR',{weekday:'long'});return heading('Local de atuação do dia','Programação da equipe.',`<div class="nav"><button onclick="moveDay(-1)">‹</button><input class="dateinput" type="date" value="${key(date)}" onchange="setDate(this.value)"><button onclick="moveDay(1)">›</button></div>`)+`<div class="panel daily">${people().map(u=>`<div class="person"><strong>${safe(u.name)}</strong><div>${safe(get(u.name,date))||'<span class="none">Não informado</span>'}</div></div>`).join('')}</div>`}function render(){document.getElementById('loginScreen').classList.toggle('hidden',!!current);document.getElementById('app').classList.toggle('hidden',!current);if(!current)return;renderStatus();document.getElementById('identity').textContent=current.name;let tabs=current.role==='consultor'?[['schedule','Programação semanal'],['today','Local do dia'],['ho','HO da semana']]:[['today','Local do dia'],['ho','HO da semana']];if(!tabs.some(t=>t[0]===active))active=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>`<button class="tab ${k===active?'active':''}" onclick="changeTab('${k}')">${v}</button>`).join('');document.getElementById('content').innerHTML=active==='schedule'?schedule():active==='today'?today():ho()}document.getElementById('who').innerHTML=USERS.map(u=>`<option value="${safe(u.name)}">${safe(u.name)}</option>`).join('');render();fetchShared();
</script></body></html>
