/* V25: cards compactos, com detalhes sob demanda */
.daily.daily-compact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;background:transparent;border:0;box-shadow:none;overflow:visible}
.daily-compact .compact-card{display:block;min-width:0;margin:0;border:1px solid #dbe5ef;border-radius:13px;background:#fff;box-shadow:0 3px 12px rgba(36,38,62,.045);overflow:hidden;transition:border-color .18s,box-shadow .18s}
.daily-compact .compact-card[open]{border-color:#a9c6f5;box-shadow:0 6px 18px rgba(35,85,217,.09)}
.daily-compact .compact-head{display:flex;align-items:center;gap:11px;padding:14px 15px;min-height:76px;list-style:none;cursor:default;border-left:3px solid #2355d9}
.daily-compact .compact-card:nth-child(3n+2) .compact-head{border-left-color:#63b4cc}
.daily-compact .compact-card:nth-child(3n) .compact-head{border-left-color:#f05a45}
.daily-compact summary.compact-head{cursor:pointer}
.daily-compact summary.compact-head::-webkit-details-marker{display:none}
.daily-compact summary.compact-head:hover{background:#f6f9ff}
.daily-compact .person-avatar{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#eaf1ff;color:#2355d9;font-size:13px;font-weight:800}
.daily-compact .compact-info{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.daily-compact .compact-info strong{display:block;font-size:13px;line-height:1.2;color:#24263e;font-weight:750;margin:0!important;border:0!important;padding:0!important}
.daily-compact .compact-place{font-size:12px;color:#4b5871;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.daily-compact .compact-card[open] .compact-place{display:block;overflow:visible}
.daily-compact .compact-chevron{color:#2355d9;font-size:22px;line-height:1;transition:transform .18s;flex:0 0 15px;text-align:center}
.daily-compact .compact-card[open] .compact-chevron{transform:rotate(180deg)}
.daily-compact .compact-details{padding:12px 16px 15px 60px;background:#f6f9ff;border-top:1px solid #e5edf8;display:grid;gap:12px}
.daily-compact .compact-detail span{display:block;color:#526989;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;margin-bottom:4px}
.daily-compact .compact-detail p{font-size:12px;color:#263650;line-height:1.5;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(min-width:651px) and (max-width:1100px){.daily.daily-compact{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.daily.daily-compact{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}.daily-compact .compact-head{padding:12px 13px;min-height:69px}.daily-compact .compact-info strong{font-size:14px}.daily-compact .compact-place{font-size:13px}.daily-compact .compact-details{padding:13px 16px 15px 60px}.daily-compact .compact-detail p{font-size:13px}}

/* V26 — fotos de perfil */
.person-avatar.photo-avatar{background:#eaf2fa;overflow:hidden;padding:0;border:2px solid #dce9f7}
.person-avatar.photo-avatar img{display:block;width:100%;height:100%;object-fit:cover}
.photo-admin{background:#fff;border:1px solid #dce5f2;border-radius:16px;padding:20px;max-width:850px}
.photo-admin h3{margin:0 0 8px;color:#24263e}.photo-admin p{margin:0 0 15px}
.photo-login{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.photo-admin label{font-size:12px;font-weight:700;color:#4b5b74;display:block;margin-bottom:5px}
.photo-admin input,.photo-admin select{width:100%;padding:11px;border:1px solid #d4dfeb;border-radius:9px;background:#fff;color:#24263e}
.photo-admin button{padding:11px 14px;border:0;border-radius:9px;background:#2355d9;color:white;font-weight:700}
.photo-admin button.ghost{background:#edf3fc;color:#2355d9}
.photo-tools{display:grid;grid-template-columns:1fr 1.5fr auto auto;gap:10px;align-items:end}
.photo-note{margin-top:12px!important;font-size:12px;color:#607089}
@media(max-width:700px){.photo-login,.photo-tools{grid-template-columns:1fr}.photo-admin{padding:15px}}
[hidden]{display:none!important}.feriado-indicador{display:block;font-size:10px;font-weight:700;color:#a04c27;background:#fff3e9;border:1px solid #f8d8bf;border-radius:6px;padding:3px 6px;margin:3px 0 5px;line-height:1.35;white-space:normal}.compact-info .feriado-indicador{width:fit-content;max-width:100%}

.vacation-panel{margin:0 0 18px;background:#fff;border:1px solid #e3e7f0;border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(36,38,62,.035)}
.vacation-panel summary{padding:15px 19px;cursor:pointer;font-weight:700;color:#24263e;list-style:none;display:flex;justify-content:space-between;align-items:center}
.vacation-panel summary::-webkit-details-marker{display:none}
.vacation-panel[open] .vacation-chevron{transform:rotate(180deg)}
.vacation-inner{border-top:1px solid #edf0f5;padding:16px 19px 18px}

.vacation-fields{display:flex;align-items:end;flex-wrap:wrap;gap:12px}
.vacation-fields label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:650;color:#41475a;flex:1 1 160px}
.vacation-fields input,.vacation-fields select{border:1px solid #dce1eb;border-radius:9px;background:#fff;padding:11px 10px;color:#24263e;font:inherit;min-height:42px;max-width:100%}

.vacation-inner .vacation-hint{margin:13px 0 0;font-size:12px}
@media(max-width:650px){.vacation-fields{display:grid;grid-template-columns:1fr 1fr}.vacation-fields label:first-child,.vacation-fields button{grid-column:1/-1}.vacation-panel summary{padding:14px}}

async function fetchShared(){try{const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};const [u,p]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/consultores?select=id,nome,perfil&ativo=eq.true',{headers}),fetch(SUPABASE_URL+'/rest/v1/programacoes?select=consultor_id,data,atividade',{headers})]);if(!u.ok||!p.ok)throw Error('Leitura bloqueada pelo RLS ou indisponível');dbUsers=await u.json();const rows=await p.json();remoteRecords={};const names=Object.fromEntries(dbUsers.map(x=>[x.id,x.nome]));rows.forEach(x=>{const n=names[x.consultor_id];if(n){remoteRecords[n]??={};remoteRecords[n][x.data]=x.atividade}});connectionStatus='Conectado ao Supabase';loadProfilePhotos();}catch(e){connectionStatus='Sem leitura compartilhada: configure a política SELECT no Supabase';}render()}

function feriadoConsultor(nome,d){
 if(d.getFullYear()!==2027)return null;
 const md=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const nacionais={'01-01':'Confraternização Universal','03-26':'Paixão de Cristo','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência do Brasil','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Dia Nacional de Zumbi e da Consciência Negra','12-25':'Natal'};
 const local=FERIADOS_2027[RESIDENCIA[nome]]?.[md];
 if(local){return {tipo:local[0],nome:local[1],cidade:RESIDENCIA[nome]}}
 if(nacionais[md])return {tipo:'Nacional',nome:nacionais[md],cidade:RESIDENCIA[nome]};
 return null;
}
function get(name,d){const stored=remoteRecords[name]?.[key(d)] ?? records[name]?.[key(d)];if(stored!==undefined && stored!=='')return stored;const f=feriadoConsultor(name,d);if(f)return '📅 Feriado '+f.tipo+' — '+f.nome;return holiday(d)?'🇧🇷 Feriado Nacional — '+holiday(d):''}function save(name,d,value){records[name]??={};records[name][key(d)]=value;localStorage.setItem(DATA_KEY,JSON.stringify(records))}function people(){return USERS.filter(u=>u.role==='consultor').sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}))}function enter(){current=USERS.find(u=>u.name===document.getElementById('who').value);if(!current)return;localStorage.setItem(USER_KEY,current.name);active=current.role==='consultor'?'schedule':'today';selectedDate=defaultBusinessDate();render();fetchShared()}function switchUser(){if(current?.name!=='Lindemberg')return;localStorage.removeItem(USER_KEY);current=null;render()}

let secretExitCount=0,secretExitLast=0;
async function hiddenAdminExit(){
 const now=Date.now();secretExitCount=(now-secretExitLast<1400)?secretExitCount+1:1;secretExitLast=now;
 if(secretExitCount<7)return;secretExitCount=0;

 if(!/^\d{6}$/.test(pin)){alert('PIN inválido.');return;}
 try{
  const response=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
   method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
   body:JSON.stringify({email:email.trim(),password:pin})
  });
  const result=await response.json();
  if(!response.ok||!result.access_token||result.user?.id!=='e27fab38-dced-4732-aef3-d02dc67410c4')throw Error('Acesso não autorizado.');
  if(!confirm('Acesso administrativo confirmado. Deseja voltar à seleção de usuário?'))return;

 }catch(err){alert('Não foi possível validar o acesso administrativo.');}
}

function normalizeActivity(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function exemptActivity(local){const s=normalizeActivity(local).replace(/[.]/g,'').trim();if(!s)return false;

 <textarea class="inline-local" id="inlineLocal" rows="2" placeholder="Ex.: Hub Parque II – ALTA ou HO" oninput="updateInlineExemption()">${safe(a.local)}</textarea>
 <div id="inlineVisitFields" class="inline-visit-fields">
 <label class="inline-label" for="inlineMotivo">Motivo da visita <span class="required-mark">*</span></label>
 <input class="inline-one-line" id="inlineMotivo" type="text" placeholder="Objetivo da visita" value="${safe(a.motivo)}">
 <label class="inline-label" for="inlineIndicador">Indicador <span class="required-mark">*</span></label>
 <input class="inline-one-line" id="inlineIndicador" type="text" placeholder="Indicador que motivou a visita" value="${safe(a.indicador)}">
 </div>
 <div class="inline-error" id="inlineError" role="alert"></div>
 <div class="inline-actions"><button type="button" class="inline-cancel" onclick="cancelInline()">Cancelar</button><button type="button" class="inline-save" onclick="confirmActivity()">Salvar</button></div></div>`;
 updateInlineExemption();document.getElementById('inlineLocal').focus();
}
function updateInlineExemption(){
 const local=document.getElementById('inlineLocal');const fields=document.getElementById('inlineVisitFields');if(!local||!fields)return;
 fields.classList.toggle('hidden',exemptActivity(local.value));
}
function cancelInline(){if(!editingActivity)return;editingActivity=null;render()}
function confirmActivity(){
 if(!editingActivity)return;
 const local=document.getElementById('inlineLocal').value.trim();
 const motivo=document.getElementById('inlineMotivo').value.trim();
 const indicador=document.getElementById('inlineIndicador').value.trim();
 const error=document.getElementById('inlineError');
 if(!local){error.textContent='Informe o local ou a atividade.';return}
 const exempt=exemptActivity(local);
 if(!exempt&&(!motivo||!indicador)){error.textContent='Informe o motivo e o indicador da visita.';return}
 const {name,date}=editingActivity;
 const value=VISIT_PREFIX+JSON.stringify({local,motivo:exempt?'':motivo,indicador:exempt?'':indicador});
 const [y,m,d]=date.split('-').map(Number);
 save(name,new Date(y,m-1,d,12),value);remoteRecords[name]??={};remoteRecords[name][date]=value;
 editingActivity=null;render();const pendingKey=name+'|'+date;clearTimeout(pendingSaves[pendingKey]);pendingSaves[pendingKey]=setTimeout(()=>pushSave(name,date,value),350);
}
function schedule(){let ds=days();return heading('Programação semanal','Consulte e atualize a programação da equipe.',weekNav())+vacationPanel()+`<div class="panel tablewrap"><table><colgroup><col style="width:160px">${ds.map(()=>'<col>').join('')}</colgroup><thead><tr><th>Consultor</th>${ds.map((d,i)=>`<th>${DAYS[i]}<small>${fmt(d)}</small></th>`).join('')}</tr></thead><tbody>${people().map(u=>`<tr class="${u.name===current.name?'me':''}"><th>${safe(u.name)}${u.name===current.name?' · você':''}</th>${ds.map((d,i)=>`<td data-label="${DAYS[i]} · ${fmt(d)}">${feriadoConsultor(u.name,d)?`<span class="feriado-indicador" title="${safe(feriadoConsultor(u.name,d).nome)}">${safe(feriadoConsultor(u.name,d).tipo)} · ${safe(feriadoConsultor(u.name,d).nome)}</span>`:''}${activityCell(get(u.name,d),u.name===current.name||current.name==='Lindemberg',u.name,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function vacationPanel(){
 const options=(current.name==='Lindemberg'?people():[current]).map(u=>`<option value="${safe(u.name)}" ${u.name===current.name?'selected':''}>${safe(u.name)}</option>`).join('');
 return `<details class="vacation-panel" id="vacationPanel"><summary>🏖️ Lançar férias por período <span class="vacation-chevron">▾</span></summary><div class="vacation-inner"><p>Informe o período uma única vez. Os dias de segunda a sexta serão preenchidos automaticamente.</p><div class="vacation-fields"><label>Consultor<select id="vacationPerson">${options}</select></label><label>Início<input type="date" id="vacationStart"></label><label>Término<input type="date" id="vacationEnd"></label><button type="button" onclick="registerVacation()" id="vacationSave">Registrar férias</button></div><p class="vacation-hint" id="vacationMessage">Finais de semana não são lançados. Feriados permanecem identificados no calendário.</p></div></details>`
}
function vacationDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;const [y,m,d]=value.split('-').map(Number);const x=new Date(y,m-1,d,12);return key(x)===value?x:null}
async function registerVacation(){
 const name=document.getElementById('vacationPerson').value;
 if(current.name!=='Lindemberg' && name!==current.name)return;
 const start=vacationDate(document.getElementById('vacationStart').value),end=vacationDate(document.getElementById('vacationEnd').value),msg=document.getElementById('vacationMessage'),btn=document.getElementById('vacationSave');
 if(!start||!end){msg.textContent='Informe as datas de início e término.';return}
 if(end<start){msg.textContent='A data final deve ser igual ou posterior à inicial.';return}
 const calendarDays=Math.round((end-start)/86400000);
 if(calendarDays>366){msg.textContent='Para segurança, selecione um período de até 367 dias.';return}
 const targets=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){if(!isWeekend(d))targets.push({date:key(d),dateObj:new Date(d)})}
 if(!targets.length){msg.textContent='O período selecionado não contém dias úteis.';return}
 const existing=targets.filter(t=>{const val=remoteRecords[name]?.[t.date]??records[name]?.[t.date];return val && activitySummary(val).trim() && normalizeActivity(activitySummary(val))!=='ferias'});
 if(existing.length && !confirm(`Há ${existing.length} dia(s) com programação existente para ${name}. Deseja substituir essas atividades por férias?`))return;
 if(!confirm(`Registrar férias para ${name}, de ${start.toLocaleDateString('pt-BR')} a ${end.toLocaleDateString('pt-BR')}? Serão ${targets.length} dias úteis na programação.`))return;
 const user=dbUsers.find(u=>u.nome===name);
 if(!user){msg.textContent='Não foi possível identificar o consultor no Supabase. Verifique a conexão antes de registrar.';return}
 btn.disabled=true;msg.textContent='Salvando período no Supabase…';
 const value='🏖️ Férias';const now=new Date().toISOString();
 const rows=targets.map(t=>({consultor_id:user.id,data:t.date,atividade:value,atualizado_em:now}));
 try{
  const response=await fetch(SUPABASE_URL+'/rest/v1/programacoes?on_conflict=consultor_id,data',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
  if(!response.ok)throw Error(await response.text());
  remoteRecords[name]??={};for(const t of targets){save(name,t.dateObj,value);remoteRecords[name][t.date]=value}
  connectionStatus='Férias salvas no Supabase';render();const panel=document.getElementById('vacationPanel');if(panel){panel.open=true;document.getElementById('vacationPerson').value=name;document.getElementById('vacationStart').value=key(start);document.getElementById('vacationEnd').value=key(end);document.getElementById('vacationMessage').textContent=`Férias registradas com sucesso: ${targets.length} dias úteis.`}renderStatus();
 }catch(e){console.error('Erro ao registrar férias:',e);msg.textContent='Não foi possível salvar o período. Nenhuma alteração local foi feita. Confira a conexão e tente novamente.'}
 finally{const button=document.getElementById('vacationSave');if(button)button.disabled=false}
}
let pendingSaves={};function saveMine(el){const name=el.dataset.name||current.name,date=key(days()[Number(el.dataset.day)]),value=el.value;save(name,days()[Number(el.dataset.day)],value);const pendingKey=name+'|'+date;clearTimeout(pendingSaves[pendingKey]);pendingSaves[pendingKey]=setTimeout(()=>pushSave(name,date,value),650)}
async function pushSave(name,date,value){const user=dbUsers.find(u=>u.nome===name);if(!user){connectionStatus='Sem conexão: alteração salva apenas neste navegador';renderStatus();return}try{const r=await fetch(SUPABASE_URL+'/rest/v1/programacoes?on_conflict=consultor_id,data',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({consultor_id:user.id,data:date,atividade:value,atualizado_em:new Date().toISOString()})});if(!r.ok)throw Error(await r.text());remoteRecords[name]??={};remoteRecords[name][date]=value;connectionStatus='Salvo no Supabase';}catch(e){connectionStatus='Falha ao sincronizar · alteração salva apenas neste navegador';console.error(e)}renderStatus()}
function renderStatus(){const el=document.getElementById('syncStatus');if(el)el.textContent=connectionStatus}function isHO(s){return /(^|[^a-záàâãéêíóôõúç])ho([^a-záàâãéêíóôõúç]|$)/i.test(s)}function ho(){return heading('HO da semana','Consultores em home office por dia.',weekNav())+`<div class="cards">${days().map((d,i)=>{let names=people().filter(u=>isHO(activitySummary(get(u.name,d)))).map(u=>u.name);return `<section class="daycard"><h3>${DAYS[i]}</h3><div class="date">${fmt(d)}</div>${names.length?`<ul>${names.map(n=>`<li>${safe(n)}</li>`).join('')}</ul>`:'<span class="none">Nenhum HO informado</span>'}</section>`}).join('')}</div>`}function dailyCompactCard(u,date){
 const a=parseActivity(get(u.name,date));
 const hasDetails=!!(a.motivo||a.indicador);
 const name=safe(u.name),local=a.local?safe(a.local):'<span class="none">Não informado</span>';
 const header=`<span class="person-avatar ${profilePhotos[u.name]?'photo-avatar':''}" aria-hidden="true">${profilePhotos[u.name]?`<img src="${safe(profilePhotos[u.name])}" alt="" loading="lazy">`:safe(u.name.charAt(0))}</span><span class="compact-info"><strong>${name}</strong>${feriadoConsultor(u.name,date)?`<span class="feriado-indicador">${safe(feriadoConsultor(u.name,date).tipo)} · ${safe(feriadoConsultor(u.name,date).nome)}</span>`:''}<span class="compact-place">${local}</span></span>`;
 if(!hasDetails)return `<article class="compact-card compact-simple"><div class="compact-head">${header}</div></article>`;
 return `<details class="compact-card compact-expandable"><summary class="compact-head">${header}<span class="compact-chevron" aria-hidden="true">⌄</span></summary><div class="compact-details">${a.motivo?`<div class="compact-detail"><span>Motivo da visita</span><p>${safe(a.motivo)}</p></div>`:''}${a.indicador?`<div class="compact-detail"><span>Indicador</span><p>${safe(a.indicador)}</p></div>`:''}</div></details>`;
}
const PHOTO_BUCKET='fotos-consultores';
function photoFileName(name){return name==='Jéssica'?'Jessica.jpg':encodeURIComponent(name)+'.jpg'}
async function loadProfilePhotos(){
 try{const r=await fetch(SUPABASE_URL+'/storage/v1/object/list/'+PHOTO_BUCKET,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:100,offset:0})});
 if(!r.ok)return;const files=await r.json();profilePhotos={};for(const u of [...USERS].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}))){const file=files.find(f=>f.name===photoFileName(u.name));if(file)profilePhotos[u.name]=SUPABASE_URL+'/storage/v1/object/public/'+PHOTO_BUCKET+'/'+file.name+'?v='+encodeURIComponent(file.updated_at||'1')}
 if(current&&active==='today')render();}catch(e){console.warn('Fotos indisponíveis',e)}
}
function photoManager(){return heading('Fotos da equipe','Gerencie as fotos exibidas no Local do Dia.')+`<section class="photo-admin"><h3>Gerenciamento de fotos</h3>${!photoAdminSession?`<p>Entre com a conta administrativa cadastrada no Supabase. O PIN não fica gravado no HTML.</p><div class="photo-login"><div><label>E-mail administrativo</label><input id="adminEmail" type="email" autocomplete="username" placeholder="seu e-mail"></div><div><label>PIN de acesso</label><input id="adminPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 dígitos"></div><button onclick="adminLogin()">Entrar</button></div>`:`<p>Escolha o consultor e uma foto JPG, PNG ou WebP (até 3 MB).</p><div class="photo-tools"><div><label>Consultor</label><select id="photoName">${USERS.map(u=>`<option value="${safe(u.name)}">${safe(u.name)}</option>`).join('')}</select></div><div><label>Foto</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"></div><button onclick="uploadPhoto()">Salvar foto</button><button class="ghost" onclick="removePhoto()">Remover</button></div><p class="photo-note"><button class="ghost" onclick="adminLogout()">Sair da administração</button></p>`}<p class="photo-note" id="photoMessage">As fotos são públicas para visualização; apenas o usuário administrativo autorizado pode alterá-las.</p></section>`}
function photoMsg(m){const e=document.getElementById('photoMessage');if(e)e.textContent=m}
async function adminLogin(){const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPin').value;if(!/^\d{6}$/.test(password)){photoMsg('Informe um PIN de 6 dígitos.');return}photoMsg('Verificando acesso…');try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok||!d.access_token)throw Error('E-mail ou PIN inválido.');photoAdminSession=d;render();photoMsg('Acesso administrativo validado.')}catch(e){photoMsg(e.message)}}
function adminLogout(){photoAdminSession=null;render()}
async function uploadPhoto(){const name=document.getElementById('photoName').value,file=document.getElementById('photoFile').files[0];if(!file){photoMsg('Escolha uma foto.');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){photoMsg('Use JPG, PNG ou WebP de até 3 MB.');return}photoMsg('Enviando foto…');try{const image=await createPhotoJpeg(file);const path=photoFileName(name);const r=await fetch(SUPABASE_URL+'/storage/v1/object/'+PHOTO_BUCKET+'/'+path,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+photoAdminSession.access_token,'Content-Type':'image/jpeg','x-upsert':'true'},body:image});if(!r.ok){let detail='';try{const d=await r.json();detail=d.message||d.error||''}catch{}throw Error('Não foi possível salvar'+(detail?': '+detail:'. Confira as políticas do Storage.'))}await loadProfilePhotos();photoMsg('Foto salva com sucesso.')}catch(e){photoMsg(e.message)}}
async function createPhotoJpeg(file){const img=await createImageBitmap(file);const side=Math.min(img.width,img.height),canvas=document.createElement('canvas');canvas.width=canvas.height=320;const c=canvas.getContext('2d');c.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,320,320);img.close();return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.85))}
async function removePhoto(){const name=document.getElementById('photoName').value;if(!confirm('Remover a foto de '+name+'?'))return;photoMsg('Removendo…');const r=await fetch(SUPABASE_URL+'/storage/v1/object/'+PHOTO_BUCKET+'/'+photoFileName(name),{method:'DELETE',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+photoAdminSession.access_token}});if(r.ok){await loadProfilePhotos();photoMsg('Foto removida.')}else photoMsg('Não foi possível remover a foto. Confira as permissões.');}
function today(){let date=selectedDate;return heading('Local de atuação do dia','Programação da equipe.',`<div class="nav"><button onclick="moveDay(-1)">‹</button><input class="dateinput" type="date" value="${key(date)}" onchange="setDate(this.value)"><button onclick="moveDay(1)">›</button></div>`)+`<div class="daily daily-compact">${people().map(u=>dailyCompactCard(u,date)).join('')}</div>`}
function render(){document.getElementById('loginScreen').classList.toggle('hidden',!!current);document.getElementById('app').classList.toggle('hidden',!current);if(!current)return;renderStatus();document.getElementById('identity').textContent=current.name;document.getElementById('avatar').textContent=current.name.charAt(0).toUpperCase();document.getElementById('switchUserButton').hidden=current.name!=='Lindemberg';let tabs=current.role==='consultor'?[['schedule','Programação semanal'],...(current.name==='Lindemberg'?[['today','Local do dia']]:[]),['ho','HO da semana'],...(current.name==='Lindemberg'?[['photos','Fotos da equipe']]:[])]:[['today','Local do dia'],['ho','HO da semana']];if(!tabs.some(t=>t[0]===active))active=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>`<button class="tab ${k===active?'active':''}" onclick="changeTab('${k}')">${v}</button>`).join('');document.getElementById('content').innerHTML=active==='schedule'?schedule():active==='today'?today():active==='photos'?photoManager():ho()}if(current?.role==='coordenadora')selectedDate=defaultBusinessDate();document.getElementById('who').innerHTML=[...USERS].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(u=>`<option value="${safe(u.name)}">${safe(u.name)}</option>`).join('');render();fetchShared();loadProfilePhotos();
</script></body></html>
